services:

  laravel.test:
    build:
      context: './vendor/laravel/sail/runtimes/8.4'
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'

    image: 'sail-8.4/app'

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    ports:
      - '${APP_PORT:-80}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'

    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: 'off'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'

    volumes:
      - '.:/var/www/html:delegated'
      - 'vendor-volume:/var/www/html/vendor'
      - './xdebug-off.ini:/etc/php/8.4/cli/conf.d/99-xdebug-off.ini'

    networks:
      - sail

    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started


  queue-worker:
    build:
      context: './vendor/laravel/sail/runtimes/8.4'
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'

    image: 'sail-8.4/app'

    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: 'off'

    volumes:
      - '.:/var/www/html:delegated'
      - 'vendor-volume:/var/www/html/vendor'
      - './vendor:/tmp/vendor-windows:ro'
      - './xdebug-off.ini:/etc/php/8.4/cli/conf.d/99-xdebug-off.ini'

    networks:
      - sail

    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped
    command: php artisan queue:work redis --tries=3 --sleep=3


  scheduler:
    build:
      context: './vendor/laravel/sail/runtimes/8.4'
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'

    image: 'sail-8.4/app'

    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: 'off'

    volumes:
      - '.:/var/www/html:delegated'
      - 'vendor-volume:/var/www/html/vendor'
      - './vendor:/tmp/vendor-windows:ro'
      - './xdebug-off.ini:/etc/php/8.4/cli/conf.d/99-xdebug-off.ini'

    networks:
      - sail

    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

    command: php artisan schedule:work
    restart: unless-stopped


  pgsql:
    image: 'postgres:18-alpine'

    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'

    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'

    volumes:
      - 'sail-pgsql:/var/lib/postgresql'
      - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'

    networks:
      - sail

    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - '${DB_DATABASE}'
        - '-U'
        - '${DB_USERNAME}'
      retries: 3
      timeout: 5s


  redis:
    image: 'redis:alpine'

    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'

    volumes:
      - 'sail-redis:/data'

    networks:
      - sail

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - http.tcp.keep_alive=true
      - http.max_content_length=100mb

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - sail

    restart: unless-stopped


networks:
  sail:
    driver: bridge


volumes:
  sail-pgsql:
    driver: local

  sail-redis:
    driver: local

  elasticsearch-data:
    driver: local

  vendor-volume:
    driver: local